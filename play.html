<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Angel Study</title>
</head>
<body>
<script>
// Get URL parameters
const params = new URLSearchParams(window.location.search);
const lang = (params.get('l') || params.get('lang') || 'en').toLowerCase();

// Language file map
const LANG_FILES = {
  'en': '/en.html',
  'it': '/it.html',
  'fr': '/fr.html',
  'de': '/de.html',
  'ru': '/ru.html'
};

// Redirect to flashcards file
const flashcardsFile = LANG_FILES[lang] || '/en.html';
window.location.href = flashcardsFile;
</script>
</body>
</html>
